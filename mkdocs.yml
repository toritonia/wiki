
# サイトの基本情報
site_name: トリトニア女学院 Wiki
site_description: トリトニア女学院の公式Wiki

# 記事の保存場所
docs_dir: docs
site_dir: site

# Materialテーマ
theme:
  name: material
  language: ja

  palette:
    - scheme: default
      primary: blue grey
      accent: blue
  
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  
  font:
    text: Noto Sans JP         # 本文用フォント（Google Fontsから自動読み込み）
    code: JetBrains Mono       # コードブロック用等幅フォント
    
# 検索機能
plugins:
  - search:
      lang: ja

# ページのメニュー構成
nav:
  - ホーム: index.md
  - はじめに:
      - 学院とWikiについて: getting-started/index.md
      - 編集リクエスト: getting-started/request-edit.md
  - 生徒データベース: students/index.md
  - 教職員データベース: staff/index.md
  - 活動記録:
      - 一覧: activities/index.md
      - 広報部: activities/clubs/publicity.md
      - 放課後喫茶部: activities/clubs/cafe.md
      - 放課後アイドル部: activities/clubs/idol.md
  - 付録:
      - 用語集: appendix/glossary.md
      - 参考リンク: appendix/links.md
      - 変更履歴: appendix/changelog.md
      - 掲載ポリシー: appendix/publication-policy.md