
site_name: トリトニア女学院 Wiki
site_description: トリトニア女学院の公式Wiki
docs_dir: docs
site_dir: site
repo_url: https://github.com/toritonia/wiki
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.action.edit
    
theme:
  name: material
  language: ja
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ja

nav:
  - ホーム: index.md
  - 学院案内:
      - 学院概要: about/overview.md
      - よくある質問: about/faq.md
  - 授業・カリキュラム:
      - 授業一覧: curriculum/index.md
  - 学院活動:
      - 部活動: activities/clubs.md
  - 編集ガイド: contributing.md
      